name: build

# Runs on every push and pull request.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:   # allows starting a run manually from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addon
        uses: actions/checkout@v4

      # JDK 21 -- Minecraft 1.21.11 requires Java 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Caches Gradle and the downloaded Minecraft files.
      #
      # Not only about speed: once Minecraft is cached, a build no longer fails
      # just because a download source is briefly unreachable.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # The addon compiles against the client, so the client is built first.
      #
      # Fetched fresh rather than committed as a jar. A checked-in copy goes
      # stale the moment the client changes, and the addon would then build
      # against something that no longer exists -- which is exactly how a
      # missing method turns into a puzzling error weeks later.
      - name: Checkout client
        uses: actions/checkout@v4
        with:
          repository: Marcinator31/Vortex-Client
          path: client-src

      - name: Build client API
        run: |
          cd client-src
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Provide client jar to the addon
        run: |
          mkdir -p libs
          # The jar without "-sources" is the one to compile against.
          JAR=$(find client-src/build/libs -name "*.jar" ! -name "*-sources*" | head -1)
          if [ -z "$JAR" ]; then
            echo "No client jar found -- did the client build succeed?"
            ls -la client-src/build/libs || true
            exit 1
          fi
          cp "$JAR" libs/vortexclient-api.jar
          echo "Using $JAR"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Up to three attempts.
      #
      # Setup downloads Minecraft, mappings and the loader from external
      # servers. If those are briefly unreachable the build fails even though
      # nothing is wrong with the code, and a retry is enough. A real error
      # fails all three alike, and --stacktrace shows the cause.
      - name: Build addon
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt of 3 ==="
            if ./gradlew build --no-daemon --stacktrace; then
              echo "Build succeeded."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Failed -- waiting 20 seconds before retrying."
              sleep 20
            fi
          done
          echo "All three attempts failed."
          exit 1

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: vortex-plus-addon
          # Loom produces several jars. The one without "-sources" is the mod.
          path: build/libs/*.jar
